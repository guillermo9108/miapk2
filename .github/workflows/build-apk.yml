name: Build Android APK

on:
  push:
    branches:
      - main
      - app4 # Agregado para que detecte tus cambios actuales
  pull_request:
    branches:
      - main
      - app4
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO4_TOKEN }} # Ajustado a tu nombre de secret

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: 🚀 Build APK
        working-directory: ./frontend
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO4_TOKEN }} # Ajustado a tu nombre de secret

      - name: 📝 Build info
        run: |
          echo "✅ Build started successfully!"
          echo "📱 Check your build status at: https://expo.dev/accounts/guillermo9108/projects/streampay3/builds"
          echo ""
          echo "⚠️  Note: The build process continues on Expo's servers."